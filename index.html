<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nokia 1280 Launcher — Web</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nokia 1280">
<style>
  :root{
    --w: 420px;   /* 機身最大寬度 */
    --px: 3px;    /* 一個 LCD 像素在畫面上的實際大小，由 JS 量測 */
    --gap: 8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:#0b0b0c}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 50% -10%, #26282c 0%, #131416 55%, #0b0b0c 100%);
    color:#c9d1d9;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    gap:20px;
    padding:
      calc(24px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
      calc(32px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  h1{font-size:16px;font-weight:600;letter-spacing:.04em;color:#e6edf3}
  .sub{font-size:12.5px;color:#8b949e;text-align:center;line-height:1.7;max-width:640px}

  /* ---------- 機身 ---------- */
  .phone{
    width:100%; max-width:var(--w);
    display:flex; flex-direction:column;
    background:linear-gradient(#232427 0%, #151618 18%, #101113 100%);
    border-radius:30px;
    padding:14px 14px 18px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.07) inset,
      0 1px 0 rgba(255,255,255,.14) inset,
      0 30px 70px -14px rgba(0,0,0,.85);
  }
  .cam{width:5px;height:5px;border-radius:50%;margin:2px auto 6px;
       background:radial-gradient(circle at 35% 35%,#3b4a57,#0a0d10);
       box-shadow:0 0 0 1px rgba(255,255,255,.10)}
  .brandbar{display:flex;align-items:center;justify-content:center;padding:2px 0 10px}
  .brandbar span{
    font:800 clamp(15px,4.6vw,20px)/1 "Helvetica Neue",Arial,sans-serif;
    letter-spacing:.10em; color:#fff; text-indent:.10em;
  }

  /* ---------- 螢幕 ---------- */
  .screenslot{display:flex;align-items:center;justify-content:center}
  .bezel{
    position:relative; padding:4px; border-radius:4px;
    background:#000;
    box-shadow:0 0 0 1px #2c2d30, 0 2px 10px rgba(0,0,0,.6);
  }
  .screenwrap{position:relative;line-height:0;overflow:hidden;
              width:-webkit-fit-content;width:fit-content;margin:0 auto}
  canvas#lcd{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .lcdgrid{
    position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(to right, rgba(0,0,0,.06) 0 1px, transparent 1px var(--px)),
      repeating-linear-gradient(to bottom, rgba(0,0,0,.06) 0 1px, transparent 1px var(--px));
    mix-blend-mode:multiply; opacity:.6; transition:opacity .2s;
  }
  .glass{position:absolute;inset:0;pointer-events:none;
         background:linear-gradient(155deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 24%,transparent 44%)}
  body.nogrid .lcdgrid{opacity:0}

  /* ---------- 鍵盤 ---------- */
  .keys{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(6,minmax(38px,auto));
    gap:var(--gap);
  }
  .key{
    position:relative; border:0; cursor:pointer;
    border-radius:12px;
    background:linear-gradient(#34363a 0%, #232529 46%, #17181b 100%);
    color:#f2f4f6;
    box-shadow:0 1px 0 rgba(255,255,255,.13) inset, 0 3px 6px rgba(0,0,0,.5);
    transition:transform .04s, box-shadow .04s, filter .1s;
    display:flex; align-items:center; justify-content:center;
    gap:3px; padding:2px;
    touch-action:manipulation;
  }
  .key:active,.key.down{transform:translateY(2px);filter:brightness(1.45);
    box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 1px 2px rgba(0,0,0,.5)}
  .key .num{font:600 clamp(15px,4.4vw,19px)/1 "Helvetica Neue",Arial,sans-serif}
  /* 字母跟數字同一行、貼著數字的基線，右排是 def3 / mno6 / wxyz9 */
  .key .abc{font:500 clamp(8px,2.3vw,10px)/1 Arial,sans-serif;letter-spacing:.02em;color:#b9bfc6;
            align-self:center;transform:translateY(.3em)}
  .key svg{width:clamp(14px,4vw,18px);height:clamp(14px,4vw,18px);display:block}

  /* 破折號軟鍵 */
  .key.soft::after{content:"";width:38%;height:3px;border-radius:2px;background:#e9edf1}
  /* 通話 / 結束：機身鍵是黑的，只有圖示有顏色 */
  .key.call svg{fill:#3ddc57}
  .key.end  svg{fill:#ff4d43; transform:rotate(133deg)}

  /* 方向鍵：外圈是 4 向，中間白框是確定 */
  .dpad{
    grid-column:2; grid-row:1 / span 2;
    border-radius:22px;
    background:linear-gradient(#2b2d31 0%, #1b1d20 55%, #121316 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.13) inset, 0 3px 8px rgba(0,0,0,.55);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:6px;
  }
  .dpad button{
    border:0;background:transparent;cursor:pointer;padding:0;
    color:rgba(255,255,255,.30);
    font-size:clamp(9px,2.6vw,11px); line-height:1;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation; border-radius:8px;
  }
  .dpad button:active,.dpad button.down{background:rgba(255,255,255,.14);color:#fff}
  .dpad .u{grid-area:1/2} .dpad .l{grid-area:2/1} .dpad .r{grid-area:2/3} .dpad .d{grid-area:3/2}
  .dpad .ok{
    grid-area:2/2; border:2px solid #f4f6f8; border-radius:26%;
    color:transparent; background:#141518;
    aspect-ratio:1; height:100%; width:auto; margin:0 auto;
  }
  .dpad .ok:active,.dpad .ok.down{background:#3a3d42}

  /* ---------- 說明 ---------- */
  .hint{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
        gap:8px 22px;max-width:660px;width:100%;font-size:12px;color:#8b949e}
  .hint div{display:flex;gap:8px;align-items:baseline}
  kbd{background:#21262d;border:1px solid #30363d;border-bottom-width:2px;border-radius:5px;
      padding:1px 6px;font:11px/1.6 ui-monospace,Menlo,monospace;color:#c9d1d9;white-space:nowrap}
  .foot{font-size:11.5px;color:#6e7681;text-align:center;line-height:1.8}

  /* ---------- 手機：整支填滿視窗，上下不留白 ---------- */
  @media (max-width:700px){
    body{
      /* svh = 工具列展開時的可視高度。用 vh 會拿到「工具列收起」的高度，
         內容就會被 Safari 底部工具列蓋住；因為這裡不捲動，被蓋住就永遠點不到。
         min-height 也必須歸零 —— 基底的 min-height:100vh 會壓過 height。 */
      height:100vh;              /* 最舊的瀏覽器 */
      height:100svh;             /* iOS 15.4+ */
      height:var(--app-h,100svh);/* JS 量到的 innerHeight，最可靠 */
      min-height:0;
      padding:0; gap:0; overflow:hidden; justify-content:stretch;
    }
    h1,.sub,.hint,.foot{display:none}
    .phone{
      max-width:none; height:100%; border-radius:0;
      padding:
        calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
      box-shadow:none;
    }
    .cam{margin:2px auto 4px}
    .brandbar{padding:0 0 6px}
    /* basis 0 -> 兩塊的高度純粹來自剩餘空間，量測時不會跟內容互相牽制 */
    .screenslot{flex:1 1 0%;min-height:0}
    .keys{flex:1.15 1 0%;min-height:0;margin-top:10px;
          grid-template-rows:repeat(6,1fr);--gap:6px}
  }
</style>
</head>
<body>

<h1>Nokia 1280 Launcher · 網頁版</h1>
<p class="sub">128×112 單色 LCD 模擬 · 逐像素二值化渲染 · 原生 JS，零依賴、可離線<br>點畫面上的按鍵，或用實體鍵盤操作</p>

<div class="phone" id="phone">
  <div class="cam"></div>
  <div class="brandbar"><span>NOKIA</span></div>

  <div class="screenslot" id="screenslot">

  </div>

  <div class="keys">

      <button class="l" data-k="left">◀</button>
      <button class="ok" data-k="ok">OK</button>
      <button class="r" data-k="right">▶</button>
      <button class="d" data-k="down">▼</button>
    </div>
    <button class="key soft" data-k="soft2" aria-label="右軟鍵"></button>

    <button class="key call" data-k="call" aria-label="通話">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.7.1.3 0 .7-.2 1l-2.3 2.1z"/></svg>
    </button>
    <button class="key end" data-k="end" aria-label="結束">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.7.1.3 0 .7-.2 1l-2.3 2.1z"/></svg>
    </button>

    <button class="key" data-k="1"><span class="num">1</span></button>
    <button class="key" data-k="2"><span class="num">2</span><span class="abc">abc</span></button>
    <button class="key" data-k="3"><span class="abc">def</span><span class="num">3</span></button>

    <button class="key" data-k="4"><span class="num">4</span><span class="abc">ghi</span></button>
    <button class="key" data-k="5"><span class="num">5</span><span class="abc">jkl</span></button>
    <button class="key" data-k="6"><span class="abc">mno</span><span class="num">6</span></button>

    <button class="key" data-k="7"><span class="num">7</span><span class="abc">pqrs</span></button>
    <button class="key" data-k="8"><span class="num">8</span><span class="abc">tuv</span></button>
    <button class="key" data-k="9"><span class="abc">wxyz</span><span class="num">9</span></button>

    <button class="key" data-k="*"><span class="num">✱</span>
      <svg viewBox="0 0 24 24" fill="#b9bfc6"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7zm2 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
    </button>
    <button class="key" data-k="0"><span class="num">0</span>
      <svg viewBox="0 0 24 24" fill="#b9bfc6"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/></svg>
    </button>
    <button class="key" data-k="#"><span class="num">#</span></button>
  </div>
</div>

<div class="hint">
  <div><kbd>↑ ↓ ← →</kbd><span>導覽</span></div>
  <div><kbd>Enter</kbd><span>OK / 選擇</span></div>
  <div><kbd>Backspace</kbd><span>清除 / 返回</span></div>
  <div><kbd>Z</kbd> <kbd>X</kbd><span>左 / 右軟鍵</span></div>
  <div><kbd>C</kbd> <kbd>E</kbd><span>通話 / 結束鍵</span></div>
  <div><kbd>0-9 * #</kbd><span>數字鍵（多次點按輸入）</span></div>
</div>

<p class="foot">
  長按紅色結束鍵約 1 秒可關機；關機後按任意鍵開機。<br>
  選單：Messages · Contacts · Call log · Games (Snake) · Clock · Calculator · Torch · Settings
</p>

<script>
(function () {
'use strict';

/* =========================================================================
 * 1. LCD 引擎 —— 128×112 單色螢幕
 *    所有繪製都畫進離屏 canvas，present() 時逐像素二值化再放大輸出
 * ========================================================================= */
const W = 128, H = 112;

const off = document.createElement('canvas');
off.width = W; off.height = H;
const g = off.getContext('2d', { willReadFrequently: true });

const out = document.createElement('canvas');
out.width = W; out.height = H;
const gOut = out.getContext('2d');
const imgOut = gOut.createImageData(W, H);

const lcd   = document.getElementById('lcd');
const vctx  = lcd.getContext('2d');
const bezel = document.getElementById('bezel');
const slot  = document.getElementById('screenslot');

const THEMES = [
  { name: 'Olive',    paper: [163, 165, 43],  ink: [22, 24, 8]   },
  { name: 'Classic',  paper: [154, 170, 130], ink: [24, 33, 18]  },
  { name: 'Blue LED', paper: [126, 178, 205], ink: [8, 32, 48]   },
  { name: 'White',    paper: [222, 226, 214], ink: [16, 16, 16]  },
  { name: 'Amber',    paper: [205, 168, 96],  ink: [40, 24, 4]   }
];
const OFF_PAPER = [26, 28, 22];

/* =========================================================================
 * 1b. 內建 5×7 點陣字型
 *     系統字型在這種尺寸下二值化會糊掉，所以整套字自己定義：
 *     每列格式 = 字元 + ':' + 7 列 × 5 欄的 0/1（1 = 亮點）
 * ========================================================================= */
const FONT_DATA = [
' :00000:00000:00000:00000:00000:00000:00000',
'!:00100:00100:00100:00100:00100:00000:00100',
'":01010:01010:00000:00000:00000:00000:00000',
'#:01010:01010:11111:01010:11111:01010:01010',
'$:00100:01111:10100:01110:00101:11110:00100',
'%:11000:11001:00010:00100:01000:10011:00011',

'(:00010:00100:01000:01000:01000:00100:00010',

'8:01110:10001:10001:01110:10001:10001:01110',
'9:01110:10001:10001:01111:00001:00001:01110',
'::00000:00110:00110:00000:00110:00110:00000',
';:00000:00110:00110:00000:00110:00010:00100',

'p:00000:00000:11110:10001:11110:10000:10000',
'q:00000:00000:01111:10001:01111:00001:00001',
'r:00000:00000:10110:11001:10000:10000:10000',
's:00000:00000:01111:10000:01110:00001:11110',
't:01000:01000:11100:01000:01000:01001:00110',
'u:00000:00000:10001:10001:10001:10011:01101',
'v:00000:00000:10001:10001:10001:01010:00100',
'w:00000:00000:10001:10001:10101:10101:01010',
'x:00000:00000:10001:01010:00100:01010:10001',
'y:00000:00000:10001:10001:01111:00001:01110',
'z:00000:00000:11111:00010:00100:01000:11111',
'{:00110:01000:01000:11000:01000:01000:00110',
'|:00100:00100:00100:00100:00100:00100:00100',
'}:01100:00010:00010:00011:00010:00010:01100',
'~:00000:00000:01001:10110:00000:00000:00000',
'█:11111:11111:11111:11111:11111:11111:11111'
];

const GLYPHS = Object.create(null);
for (const row of FONT_DATA) GLYPHS[row[0]] = row.slice(2).split(':');
const MISSING = ['11111','10001','10001','10001','10001','10001','11111'];

const CW = 6;    // 字身 5px + 字距 1px
const LH = 9;    // 行高
const COLS = Math.floor((W - 3) / CW);   // 每行可容納字數 = 20

/* --- 繪圖基本操作 --------------------------------------------------- */
function tw(str, sc) { sc = sc || 1; return Math.max(0, str.length * CW * sc - sc); }

function frame() {                       // 清成白底（白=紙，黑=墨）
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#000';
}
/** xor=true 時用 difference 合成，黑底上就會畫出白字 */
function text(str, x, y, sc, xor) {
  sc = sc || 1;
  if (xor) { g.save(); g.globalCompositeOperation = 'difference'; g.fillStyle = '#fff'; }
  else g.fillStyle = '#000';
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const gl = GLYPHS[str[i]] || MISSING;
    for (let r = 0; r < 7; r++) {
      const bits = gl[r];
      for (let c = 0; c < 5; c++)
        if (bits.charCodeAt(c) === 49) g.fillRect(cx + c * sc, y + r * sc, sc, sc);
    }
    cx += CW * sc;
  }
  if (xor) g.restore();
}
function ctext(str, y, sc, xor) { text(str, Math.round((W - tw(str, sc)) / 2), y, sc, xor); }
function rtext(str, y, sc, xor) { text(str, W - 2 - tw(str, sc), y, sc, xor); }
function fit(str, px) { return str.slice(0, Math.max(0, Math.floor((px + 1) / CW))); }
function rect(x, y, w, h) { g.fillStyle = '#000'; g.fillRect(x, y, w, h); }
function hline(y) { rect(0, y, W, 1); }
function box(x, y, w, h) {
  rect(x, y, w, 1); rect(x, y + h - 1, w, 1);
  rect(x, y, 1, h); rect(x + w - 1, y, 1, h);
}
function invert(x, y, w, h) {
  g.save();
  g.globalCompositeOperation = 'difference';
  g.fillStyle = '#fff';
  g.fillRect(x, y, w, h);
  g.restore();
  g.fillStyle = '#000';
}
function bitmap(rows, x, y) {
  g.fillStyle = '#000';
  for (let r = 0; r < rows.length; r++)
    for (let c = 0; c < rows[r].length; c++)
      if (rows[r][c] === '1') g.fillRect(x + c, y + r, 1, 1);
}

function present() {
  const paper = S.power ? THEMES[S.theme].paper : OFF_PAPER;
  const ink   = S.power ? THEMES[S.theme].ink   : [34, 36, 30];
  const src = g.getImageData(0, 0, W, H).data;
  const dst = imgOut.data;
  for (let i = 0, n = W * H; i < n; i++) {
    const o = i << 2;
    const lum = (src[o] * 299 + src[o + 1] * 587 + src[o + 2] * 114) / 1000;
    const c = lum < 128 ? ink : paper;
    dst[o] = c[0]; dst[o + 1] = c[1]; dst[o + 2] = c[2]; dst[o + 3] = 255;
  }
  gOut.putImageData(imgOut, 0, 0);
  vctx.imageSmoothingEnabled = false;
  vctx.drawImage(out, 0, 0, W, H, 0, 0, lcd.width, lcd.height);
}

/**
 * 版面是流體的：canvas 用 JS 給定尺寸，點陣圖解析度依「可用尺寸 × 裝置像素比」
 * 反推並取整數，讓每個 LCD 像素剛好落在整數個裝置像素上，Retina 上才不會出現
 * 寬窄不一的鋸齒。手機上高度也要納入計算，否則螢幕會把鍵盤擠出視窗。
 */
function fitScreen() {
  const cs = getComputedStyle(bezel);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = slot.clientWidth - padX;
  // 桌機時 slot 的高度是由內容撐出來的，拿來當限制會互相牽制，所以只在手機版用
  const mobile = window.matchMedia('(max-width: 700px)').matches;
  const availH = mobile ? slot.clientHeight - padY : Infinity;
  if (availW <= 0) return;

  const dpr = window.devicePixelRatio || 1;
  const res = Math.max(2, Math.min(16, Math.min(
    Math.floor(availW * dpr / W),
    Math.floor(availH * dpr / H)
  )));
  if (lcd.width !== W * res) {
    lcd.width  = W * res;
    lcd.height = H * res;
    vctx.imageSmoothingEnabled = false;
  }
  const pitch = res / dpr;
  lcd.style.width  = (W * pitch) + 'px';
  lcd.style.height = (H * pitch) + 'px';
  document.documentElement.style.setProperty('--px', pitch.toFixed(4) + 'px');
  document.body.classList.toggle('nogrid', pitch < 3);
}
function applyScale() {
  document.documentElement.style.setProperty('--w', (W * SCALE + 36) + 'px');
  fitScreen();
}
/**
 * iOS Safari 的 100vh 是「工具列收起時」的高度，比實際可視區大，
 * 版面會被底部工具列蓋住而且因為不捲動就再也點不到。
 * innerHeight 才是扣掉工具列後的真實可視高度。
 */
function setAppHeight() {
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  fitScreen();
}
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
setAppHeight();

let ac = null;
function audio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, at, vol) {
  if (!S.sound) return;
  const a = audio(), t = at === undefined ? a.currentTime : a.currentTime + at;
  const o = a.createOscillator(), gain = a.createGain();
  o.type = 'square'; o.frequency.value = freq;
  gain.gain.setValueAtTime(vol === undefined ? 0.06 : vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gain); gain.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function beep()  { tone(1200, 0.035, 0, 0.05); }
function blip()  { tone(880, 0.05, 0, 0.05); }
function error() { tone(220, 0.16, 0, 0.07); }

}

function listView(items, idx, top, rows) {
  let start = Math.max(0, Math.min(idx - (rows - 1), items.length - rows));
  if (start < 0) start = 0;
  for (let i = 0; i < rows && start + i < items.length; i++) {
    const it = items[start + i];
    const y = top + i * LH;
    let x = 3;
    if (it.icon) { bitmap(it.icon, 3, y + 1); x = 13; }
    text(fit(it.label, W - x - 7), x, y + 1);
    if (start + i === idx) invert(0, y, W - 4, LH);
  }
  if (items.length > rows) {
    const trackH = rows * LH;
    box(W - 3, top, 3, trackH);
    const knob = Math.max(3, Math.round(trackH * rows / items.length));
    const ky = top + Math.round((trackH - knob) * idx / (items.length - 1));
    rect(W - 3, ky, 3, knob);
  }
}

function wrap(str, cols) {
  const words = str.split(/\s+/), lines = [];
  let cur = '';
  for (const w of words) {
    if (!cur.length) cur = w;
    else if ((cur + ' ' + w).length <= cols) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
    while (cur.length > cols) { lines.push(cur.slice(0, cols)); cur = cur.slice(cols); }
  }
  if (cur.length) lines.push(cur);
  return lines;
}

function toast(msg) { S.toast = msg; S.toastUntil = Date.now() + 1400; }

  if (!S.toast || Date.now() > S.toastUntil) { S.toast = null; return; }
  const lines = wrap(S.toast, COLS - 2);

  const y = Math.round((H - h) / 2);
  g.fillStyle = '#fff'; g.fillRect(4, y, W - 8, h);
  box(4, y, W - 8, h);
  lines.forEach((l, i) => ctext(l, y + 5 + i * LH));
}

const KEYMAP = {
  '1': ".,?!'\"1-()@/:", '2': 'abc2', '3': 'def3', '4': 'ghi4', '5': 'jkl5',
  '6': 'mno6', '7': 'pqrs7', '8': 'tuv8', '9': 'wxyz9', '0': ' 0'
};
const MODES = ['Abc', 'abc', 'ABC', '123'];

const Typer = {
  text: '', mode: 0, lastKey: null, lastAt: 0, cycle: 0,
  reset(t) { this.text = t || ''; this.lastKey = null; this.cycle = 0; },
  commit() { this.lastKey = null; },
  key(k) {
    const now = Date.now();
    if (MODES[this.mode] === '123') {
      if (KEYMAP[k] !== undefined) { this.text += k; return true; }
      if (k === '*') { this.text += '+'; return true; }
      return false;
    }
    if (!KEYMAP[k]) {
      if (k === '*') { this.text += '*'; this.commit(); return true; }
      return false;
    }
    const set = KEYMAP[k];
    if (this.lastKey === k && now - this.lastAt < 850) {
      this.cycle = (this.cycle + 1) % set.length;
      this.text = this.text.slice(0, -1);
    } else this.cycle = 0;
    let ch = set[this.cycle];
    const m = MODES[this.mode];
    if (m === 'ABC') ch = ch.toUpperCase();
    else if (m === 'Abc') {
      const prev = this.text.replace(/\s+$/, '');
      if (!prev.length || /[.!?]$/.test(prev)) ch = ch.toUpperCase();
    }
    this.text += ch;
    this.lastKey = k; this.lastAt = now;
    return true;
  },
  del() { if (this.text.length) { this.text = this.text.slice(0, -1); this.commit(); return true; } return false; },
  nextMode() { this.mode = (this.mode + 1) % MODES.length; this.commit(); }
};

/* =========================================================================
 * 6. Snake
 * ========================================================================= */
const Snake = {
  CELL: 3, X0: 1, Y0: 12, COLS: 42, ROWS: 29,
  body: [], dir: [1, 0], next: [1, 0], food: null,
  score: 0, best: Number(localStorage.getItem('n1280.snake') || 0),
  state: 'ready', acc: 0, step: 140,
  start() {
    this.body = [[8, 14], [7, 14], [6, 14]];
    this.dir = [1, 0]; this.next = [1, 0];
    this.score = 0; this.step = 140; this.acc = 0;
    this.state = 'run'; this.place();
  },
  place() {
    let p;
    do { p = [1 + ((Math.random() * (this.COLS - 2)) | 0), 1 + ((Math.random() * (this.ROWS - 2)) | 0)]; }
    while (this.body.some(b => b[0] === p[0] && b[1] === p[1]));
    this.food = p;
  },
  tick(dt) {
    if (this.state !== 'run') return;
    this.acc += dt;
    while (this.acc >= this.step) {
      this.acc -= this.step;
      this.dir = this.next;
      const h = [this.body[0][0] + this.dir[0], this.body[0][1] + this.dir[1]];
      if (h[0] < 0 || h[1] < 0 || h[0] >= this.COLS || h[1] >= this.ROWS ||
          this.body.some(b => b[0] === h[0] && b[1] === h[1])) {
        this.state = 'over'; error();
        if (this.score > this.best) { this.best = this.score; localStorage.setItem('n1280.snake', this.best); }
        return;
      }
      this.body.unshift(h);
      if (h[0] === this.food[0] && h[1] === this.food[1]) {
        this.score += 10; blip(); this.place();
        this.step = Math.max(60, this.step - 4);
      } else this.body.pop();
    }
  },
  turn(d) { if (!(d[0] === -this.dir[0] && d[1] === -this.dir[1])) this.next = d; },
  draw() {
    if (this.state === 'ready') {
      ctext('SNAKE', 26, 2);
      ctext('High ' + this.best, 52);
      ctext('Press OK', 68);
      return;
    }
    const C = this.CELL;
    box(this.X0 - 1, this.Y0 - 1, this.COLS * C + 2, this.ROWS * C + 2);
    for (const b of this.body) rect(this.X0 + b[0] * C, this.Y0 + b[1] * C, C, C);
    if (this.food) {
      const f = this.food;
      rect(this.X0 + f[0] * C + 1, this.Y0 + f[1] * C, 1, C);
      rect(this.X0 + f[0] * C, this.Y0 + f[1] * C + 1, C, 1);
    }
    text('Score ' + this.score, 2, 1);
    if (this.state === 'over') {
      const bw = 80, bh = 30, bx = (W - bw) >> 1, by = 34;
      g.fillStyle = '#fff'; g.fillRect(bx, by, bw, bh);
      box(bx, by, bw, bh);
      ctext('GAME OVER', by + 6);
      ctext('Score ' + this.score, by + 17);
    }
  }
};

/* =========================================================================
 * 7. 計算機
 * ========================================================================= */
const Calc = {
  cur: '0', acc: null, op: null, fresh: true,
  OPS: ['+', '-', 'x', '/'],
  digit(d) {
    if (this.fresh) { this.cur = (d === '.') ? '0.' : d; this.fresh = false; return; }
    if (d === '.' && this.cur.includes('.')) return;
    if (this.cur === '0' && d !== '.') this.cur = d;
    else if (this.cur.replace('-', '').replace('.', '').length < 11) this.cur += d;
  },
  cycleOp() {
    const i = this.op === null ? -1 : this.OPS.indexOf(this.op);
    if (i === -1) { this.acc = parseFloat(this.cur); this.op = '+'; this.fresh = true; }
    else this.op = this.OPS[(i + 1) % 4];
  },
  eq() {
    if (this.op === null) return;
    const b = parseFloat(this.cur), a = this.acc;
    let r;
    switch (this.op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case 'x': r = a * b; break;
      case '/': r = (b === 0 ? NaN : a / b); break;
    }
    this.cur = isFinite(r) ? String(Math.round(r * 1e8) / 1e8) : 'Error';
    this.acc = null; this.op = null; this.fresh = true;
  },
  clear() { this.cur = '0'; this.acc = null; this.op = null; this.fresh = true; },
  neg() { this.cur = this.cur.startsWith('-') ? this.cur.slice(1) : '-' + this.cur; }
};

    },
    key(k) {
      if (k === 'up' || k === 'down') { S.listIdx = (S.listIdx + 1) % 2; beep(); }
      if (k === 'ok' || k === 'soft1') {
        blip();
        if (S.listIdx === 0) go('inbox');
        else { Typer.reset(''); composeTarget = ''; go('compose'); }
      }
      if (k === 'soft2' || k === 'clear' || k === 'end') back();
    }
  },

  inbox: {
    draw() {
      titleBar('Inbox');
      listView(MESSAGES.map(m => ({ label: m.from })), S.listIdx, 23, 8);
      softBar2('Read', 'Back');
    },
    key(k) {
      if (k === 'up')   { S.listIdx = (S.listIdx + MESSAGES.length - 1) % MESSAGES.length; beep(); }
      if (k === 'down') { S.listIdx = (S.listIdx + 1) % MESSAGES.length; beep(); }
      if (k === 'ok' || k === 'soft1') { viewMsg = S.listIdx; blip(); go('msgview'); }
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  msgview: {
    scroll: 0,
    enter() { this.scroll = 0; },
    draw() {
      const m = MESSAGES[viewMsg];
      titleBar(fit(m.from, W - 6));
      const lines = wrap(m.body, COLS);
      for (let i = 0; i < 8 && i + this.scroll < lines.length; i++)
        text(lines[i + this.scroll], 3, 23 + i * LH);
      softBar2('Reply', 'Back');
    },
    key(k) {
      const lines = wrap(MESSAGES[viewMsg].body, COLS);
      if (k === 'down' && this.scroll < lines.length - 8) { this.scroll++; beep(); }
      if (k === 'up' && this.scroll > 0) { this.scroll--; beep(); }
      if (k === 'soft1' || k === 'ok') { Typer.reset(''); composeTarget = MESSAGES[viewMsg].from; blip(); go('compose'); }
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  compose: {
    draw() {
      text(MODES[Typer.mode], 1, 1);
      rtext(String(Typer.text.length), 1);
      hline(10);
      const lines = wrap(Typer.text + '█', COLS);
      const start = Math.max(0, lines.length - 9);
      for (let i = start; i < lines.length; i++)
        text(lines[i], 3, 13 + (i - start) * LH);
      softBar2(Typer.text ? 'Send' : 'Abc', 'Clear');
    },
    key(k) {
      if (k === '#') { Typer.nextMode(); beep(); return; }
      if (Typer.key(k)) { beep(); return; }
      if (k === 'clear' || k === 'soft2') { if (!Typer.del()) back(); return; }
      if (k === 'soft1' || k === 'ok') {
        if (Typer.text) { blip(); toast('Message sent'); Typer.reset(''); setTimeout(back, 900); }
        return;
      }
      if (k === 'end') home();
    }
  },

  /* ---- 聯絡人 ---- */
  contacts: {
    draw() {
      titleBar('Contacts');
      listView(CONTACTS.map(c => ({ label: c.name })), S.listIdx, 23, 8);
      softBar2('View', 'Back');
    },
    key(k) {
      if (k === 'up')   { S.listIdx = (S.listIdx + CONTACTS.length - 1) % CONTACTS.length; beep(); }
      if (k === 'down') { S.listIdx = (S.listIdx + 1) % CONTACTS.length; beep(); }
      if (k === 'ok' || k === 'soft1') { viewContact = S.listIdx; blip(); go('contactview'); }
      if (k === 'call') doCall(CONTACTS[S.listIdx].name);
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  contactview: {
    draw() {
      const c = CONTACTS[viewContact];
      titleBar('Details');
      ctext(fit(c.name, W - 4), 34, 2);
      ctext(c.num, 60);
      softBar2('Call', 'Back');
    },
    key(k) {
      if (k === 'soft1' || k === 'ok' || k === 'call') doCall(CONTACTS[viewContact].name);
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  /* ---- 通話記錄 ---- */
  calllog: {
    draw() {
      titleBar('Call log');
      const marks = { out: '>', in: '<', missed: '!' };
      listView(CALLLOG.map(c => ({ label: marks[c.t] + ' ' + c.name + '  ' + c.when })), S.listIdx, 23, 8);
      softBar2('Call', 'Back');
    },
    key(k) {
      if (k === 'up')   { S.listIdx = (S.listIdx + CALLLOG.length - 1) % CALLLOG.length; beep(); }
      if (k === 'down') { S.listIdx = (S.listIdx + 1) % CALLLOG.length; beep(); }
      if (k === 'ok' || k === 'soft1' || k === 'call') doCall(CALLLOG[S.listIdx].name);
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  calling: {
    draw() {
      statusBar();
      ctext('Calling...', 26);
      ctext(fit(callWho, W - 4), 40);
      const s = Math.floor((Date.now() - callStart) / 1000);
      ctext(String((s / 60) | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'), 60, 2);
      softBar2('', 'End');
    },
    key(k) { if (k === 'end' || k === 'soft2' || k === 'clear' || k === 'ok') { tone(440, .1); S.dial = ''; back(); } }
  },

  /* ---- 遊戲 ---- */
  games: {
    enter() { Snake.state = 'ready'; },
    reenter() { Snake.state = 'ready'; },
    draw() {
      Snake.draw();
      if (Snake.state === 'ready')     softBar2('Start', 'Back');
      else if (Snake.state === 'over') softBar2('Again', 'Back');
      else                             softBar2('', 'Pause');
    },
    key(k) {
      if (Snake.state === 'run') {
        if (k === 'up' || k === '2')    Snake.turn([0, -1]);
        if (k === 'down' || k === '8')  Snake.turn([0, 1]);
        if (k === 'left' || k === '4')  Snake.turn([-1, 0]);
        if (k === 'right' || k === '6') Snake.turn([1, 0]);
        if (k === 'soft2' || k === 'clear' || k === 'ok') Snake.state = 'ready';
        if (k === 'end') home();
        return;
      }
      if (k === 'ok' || k === 'soft1' || k === '5') { Snake.start(); blip(); return; }
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  /* ---- 時鐘 ---- */
  clock: {
    draw() {
      titleBar('Clock');
      ctext(clock2(), 40, 2);
      ctext(dateStr(), 66);
      softBar2('', 'Back');
    },
    key(k) { if (k === 'soft2' || k === 'clear' || k === 'ok') back(); if (k === 'end') home(); }
  },

  /* ---- 計算機 ---- */
  calc: {
    draw() {
      titleBar('Calculator');
      const line = (Calc.op ? Calc.op + ' ' : '') + Calc.cur;
      rtext(line.slice(-20), 32, line.length <= 10 ? 2 : 1);
      hline(56);
      text('* = operator', 3, 62);
      text('# = decimal', 3, 72);
      text('OK = equals', 3, 82);
      softBar2('=', 'Clear');
    },
    key(k) {
      if (/^[0-9]$/.test(k)) { Calc.digit(k); beep(); return; }
      if (k === '#') { Calc.digit('.'); beep(); return; }
      if (k === '*') { Calc.cycleOp(); beep(); return; }
      if (k === 'ok' || k === 'soft1') { Calc.eq(); blip(); return; }
      if (k === 'left') { Calc.neg(); beep(); return; }
      if (k === 'clear' || k === 'soft2') {
        if (Calc.cur !== '0' || Calc.op) { Calc.clear(); beep(); } else back();
        return;
      }
      if (k === 'end') home();
    }
  },

  /* ---- 手電筒 ---- */
  torch: {
    draw() {
      const cx = W >> 1;
      for (let i = 0; i < 40; i++) rect(cx - i, 34 + i, 1 + i * 2, 1);   // 光束
      rect(cx - 7, 20, 14, 14);                                          // 燈頭
      rect(cx - 4, 15, 8, 5);
      invert(0, 10, W, SOFT_LINE - 10);
      ctext('TORCH ON', 1);
      softBar2('', 'Off');
    },
    key(k) { if (k) back(); }
  },

  /* ---- 設定 ---- */
  settings: {
    draw() {
      titleBar('Settings');
      listView([
        { label: 'Screen: ' + THEMES[S.theme].name },
        { label: 'Carrier: ' + S.carrier },
        { label: 'Sound: ' + (S.sound ? 'On' : 'Off') },
        { label: 'Size: ' + SCALE + 'x' },
        { label: 'About' }
      ], S.listIdx, 23, 8);
      softBar2('Change', 'Back');
    },
    key(k) {
      const n = 5;
      if (k === 'up')   { S.listIdx = (S.listIdx + n - 1) % n; beep(); }
      if (k === 'down') { S.listIdx = (S.listIdx + 1) % n; beep(); }
      if (k === 'ok' || k === 'soft1' || k === 'right') {
        blip();
        if (S.listIdx === 0) S.theme = (S.theme + 1) % THEMES.length;
        if (S.listIdx === 1)
          S.carrier = CARRIERS[(CARRIERS.indexOf(S.carrier) + 1) % CARRIERS.length];
        if (S.listIdx === 2) S.sound = !S.sound;
        if (S.listIdx === 3) { SCALE = SCALE >= 5 ? 2 : SCALE + 1; applyScale(); }
        if (S.listIdx === 4) go('about');
        save();
      }
      if (k === 'soft2' || k === 'clear') back();
      if (k === 'end') home();
    }
  },

  about: {
    draw() {
      titleBar('About');
      ctext('Nokia 1280', 32, 2);
      ctext('Web Launcher', 56);
      ctext('128x112 mono', 70);
      softBar2('', 'Back');
    },
    key(k) { if (k) back(); }
  },

  /* ---- 開機動畫 ---- */
  bootscr: {
    draw() {
      const t = Date.now() - S.boot;
      if (t < 1200) {
        ctext('NOKIA', 44, 2);
      } else {
        ctext('NOKIA', 26, 2);
        const p = Math.min(1, (t - 1200) / 700);
        const gap = Math.round((1 - p) * 20);
        rect(38 - gap, 56, 26, 3);
        rect(64 + gap, 56, 26, 3);
        ctext('Connecting People', 74);
      }
      if (t > 2400) { S.scr = 'idle'; S.stack.length = 0; }
    },
    key() {}
  }
};

function doCall(who) {
  callWho = who; callStart = Date.now();
  tone(440, .12); tone(520, .12, .16);
  S.stack.push(S.scr); S.scr = 'calling';
}

/* =========================================================================
 * 9. 電源 / 輸入 / 主迴圈
 * ========================================================================= */
function powerOn() {
  S.power = true; S.boot = Date.now(); S.scr = 'bootscr'; S.stack.length = 0; S.dial = '';
  playTune();
}
function powerOff() {
  S.power = false; S.scr = 'idle'; S.stack.length = 0; S.dial = '';
  tone(520, .1); tone(392, .16, .12);
}
function press(k) {
  if (!S.power) { powerOn(); return; }
  if (S.scr === 'bootscr') return;
  const scr = SCR[S.scr];
  if (scr && scr.key) scr.key(k);
}

let endHold = null;
function keyDown(k) {
  if (k === 'end' && S.power) {
    endHold = setTimeout(() => { endHold = null; powerOff(); }, 900);
    return;
  }
  press(k);
}
function keyUp(k) {
  if (k === 'end' && endHold) { clearTimeout(endHold); endHold = null; press('end'); }
}

document.querySelectorAll('[data-k]').forEach(btn => {
  const k = btn.dataset.k;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); keyDown(k); });
  btn.addEventListener('pointerup',   e => { e.preventDefault(); btn.classList.remove('down'); keyUp(k); });
  btn.addEventListener('pointerleave', () => btn.classList.remove('down'));
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

const KEYS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  Enter: 'ok', Backspace: 'clear', Escape: 'end',
  z: 'soft1', x: 'soft2', c: 'call', e: 'end'
};
const held = {};
function btnFor(k) { return document.querySelector('[data-k="' + (k === 'clear' ? 'soft2' : k) + '"]'); }
window.addEventListener('keydown', ev => {
  const k = KEYS[ev.key] || (/^[0-9*#]$/.test(ev.key) ? ev.key : null);
  if (!k) return;
  ev.preventDefault();
  if (held[k]) return;
  held[k] = true;
  const b = btnFor(k); if (b) b.classList.add('down');
  keyDown(k);
});
window.addEventListener('keyup', ev => {
  const k = KEYS[ev.key] || (/^[0-9*#]$/.test(ev.key) ? ev.key : null);
  if (!k) return;
  held[k] = false;
  const b = btnFor(k); if (b) b.classList.remove('down');
  keyUp(k);
});

function save() {
  try {
    localStorage.setItem('n1280.cfg', JSON.stringify(
      { theme: S.theme, sound: S.sound, scale: SCALE, carrier: S.carrier }));
  } catch (e) {}
}
function load() {
  try {
    const c = JSON.parse(localStorage.getItem('n1280.cfg') || '{}');
    if (typeof c.theme === 'number') S.theme = c.theme % THEMES.length;
    if (typeof c.sound === 'boolean') S.sound = c.sound;
    if (CARRIERS.indexOf(c.carrier) >= 0) S.carrier = c.carrier;
    if (typeof c.scale === 'number') SCALE = Math.min(5, Math.max(2, c.scale));
  } catch (e) {}
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(120, now - last); last = now;
  if (S.scr === 'games') Snake.tick(dt);

  frame();
  if (!S.power) {
    ctext('Press any key', 46);
    ctext('to power on', 58);
  } else {
    SCR[S.scr].draw(now);
    drawToast();
  }
  present();
  requestAnimationFrame(loop);
}

load();
applyScale();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
